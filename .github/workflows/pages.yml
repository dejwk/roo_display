name: Docs

on:
  push:
    branches: [ main, master ]
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz libclang-dev

      - name: Download Doxygen Awesome assets
        env:
          DOXYGEN_AWESOME_COMMIT: 1f3620084ff75734ed192101acf40e9dff01d848 # v2.4.1
        run: |
          curl --fail-with-body --retry 3 --location \
            --output docs/doxygen-awesome.css \
            "https://raw.githubusercontent.com/jothepro/doxygen-awesome-css/${DOXYGEN_AWESOME_COMMIT}/doxygen-awesome.css"
          curl --fail-with-body --retry 3 --location \
            --output docs/doxygen-awesome-sidebar-only.css \
            "https://raw.githubusercontent.com/jothepro/doxygen-awesome-css/${DOXYGEN_AWESOME_COMMIT}/doxygen-awesome-sidebar-only.css"
          curl --fail-with-body --retry 3 --location \
            --output docs/doxygen-awesome-sidebar-only-darkmode-toggle.css \
            "https://raw.githubusercontent.com/jothepro/doxygen-awesome-css/${DOXYGEN_AWESOME_COMMIT}/doxygen-awesome-sidebar-only-darkmode-toggle.css"
          curl --fail-with-body --retry 3 --location \
            --output docs/doxygen-awesome-darkmode-toggle.js \
            "https://raw.githubusercontent.com/jothepro/doxygen-awesome-css/${DOXYGEN_AWESOME_COMMIT}/doxygen-awesome-darkmode-toggle.js"

      - name: Build docs
        run: doxygen

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/doxygen/html

  deploy:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
