name: CI

on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build_and_test:
    uses: dejwk/roo_testing/.github/workflows/client-ci.yml@bc713e1ab7598be49b79ba5d9f69e7df59590814 # Pico profile support
    with:
      profiles: '["arduino", "idf"]'
      run_tests: true
      system_packages: >-
        libunwind-dev binutils-dev libx11-dev libjpeg-dev libpng-dev zlib1g-dev
      extra_bazel_args: >-
        --copt=-DHAVE_SYMBOLIZE
        --copt=-DHAVE_UNWIND
        --copt=-DHAVE_LIBUNWIND
        --linkopt=-lunwind
        --linkopt=-ldl

  touch_transport:
    uses: dejwk/roo_testing/.github/workflows/client-ci.yml@bc713e1ab7598be49b79ba5d9f69e7df59590814 # Pico profile support
    with:
      profiles: '["arduino", "idf", "arduino_esp32s3", "idf_esp32s3", "arduino_esp32c3", "idf_esp32c3", "arduino_rp2040", "arduino_rp2040_freertos"]'
      build_targets: '//:touch_xpt2046'
      test_targets: '//:xpt2046_transport_test'
